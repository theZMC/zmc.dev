name: Deploy to GitHub Pages
on:
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all artifacts (skip artifact cache restore)
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: git checkout
      uses: actions/checkout@v4
    - name: install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-
    - name: install packages
      shell: bash
      working-directory: .
      run: pnpm install
    # Build-time mermaid rendering (src/lib/diagrams) drives headless
    # chromium; runner images stopped pre-caching playwright browsers.
    # The version key comes from the pinned devDependency, and
    # `playwright install` skips the download when the cache restored it.
    - name: read playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
    - name: cache playwright chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright-version.outputs.version }}
    - name: install playwright chromium
      shell: bash
      working-directory: .
      run: pnpm exec playwright install --with-deps chromium
    # Content-addressed cache of expensive build artifacts (og cards,
    # mermaid plates, slidev decks, resume pdf — src/lib/build-cache).
    # Restore/save are split, not one actions/cache step: force_rebuild
    # must skip only the restore, and the save must land even when a
    # check gate fails, since entries are input-keyed either way. The
    # run_id key is always unique so every run saves; restore-keys picks
    # up the newest prior run's store.
    - name: restore artifact cache
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.force_rebuild != true }}
      uses: actions/cache/restore@v4
      with:
        path: .cache/artifacts
        key: artifacts-v1-${{ github.run_id }}
        restore-keys: artifacts-v1-
    - name: build astro site
      shell: bash
      working-directory: .
      run: pnpm build
    - name: save artifact cache
      uses: actions/cache/save@v4
      with:
        path: .cache/artifacts
        key: artifacts-v1-${{ github.run_id }}
    - name: check social cards
      shell: bash
      working-directory: .
      run: pnpm check:cards
    - name: check qr codes
      shell: bash
      working-directory: .
      run: pnpm check:qr
    - name: upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: deploy to github pages
      id: deployment
      uses: actions/deploy-pages@v4
